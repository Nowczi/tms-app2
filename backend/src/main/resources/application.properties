# Application
spring.application.name=TMS Backend
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/tms_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
# Options: none, validate, update, create, create-drop
# - 'none': No schema changes (requires manual schema management)
# - 'validate': Validates schema but makes no changes (default for production)
# - 'update': Updates schema to match entities (development only)
# - 'create': Creates schema on startup, drops on shutdown
# - 'create-drop': Creates schema on startup, drops on shutdown
spring.jpa.hibernate.ddl-auto=update

# Disable schema validation warnings for development
spring.jpa.properties.hibernate.check_nullability=false

# Show SQL queries
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Remove explicit dialect (auto-detected)
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Flyway Configuration (if using Flyway)
# Set to false to disable Flyway if causing conflicts
spring.flyway.enabled=false
# spring.flyway.locations=classpath:db/migration
# spring.flyway.baseline-on-migrate=true

# JWT Configuration
jwt.secret=mySecretKey123456789012345678901234567890
jwt.expiration=86400000

# CORS
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4200

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.tms=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
